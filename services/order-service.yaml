spring:
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/d_pay_orders?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
#        format_sql: true

server:
  port: 0
  forward-headers-strategy: framework



eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
    instanceId: ${spring.application.name}:${vcap.application.instance_id:${spring.application.instance_id:${random.value}}}


# ── Inventory Service URL ────────────────────────────────────────────────────
# Routes through the API Gateway (port 7000) so the Order Service never
# hard-codes the Inventory Service port directly.
inventory:
  service:
    url: http://localhost:7000